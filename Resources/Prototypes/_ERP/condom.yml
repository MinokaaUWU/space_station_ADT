- type: entity
  parent: BaseItem
  id: BaseCondom
  suffix: ERP
  abstract: true
  components:
  - type: Sprite
    sprite: _ERP/condom.rsi
  - type: Item
    size: Tiny

- type: entity
  parent: BaseCondom
  id: Condom
  suffix: ERP
  name: condom
  description: "An irreplaceable and even unique thing made of the thinnest latex, which does not allow liquid to flow out."
  components:
  - type: Sprite
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: condom
  - type: RandomSprite
    available:
      - enum.DamageStateVisualLayers.Base:
            condom: Sixteen

- type: entity
  parent: BaseCondom
  id: PinkCondom
  suffix: ERP
  name: pink condom
  description: "An irreplaceable and even unique thing made of the thinnest latex, which does not allow liquid to flow out."
  components:
  - type: Sprite
    state: condom_pink

- type: entity
  parent: BaseCondom
  id: TealCondom
  suffix: ERP
  name: teal condom
  description: "An irreplaceable and even unique thing made of the thinnest latex, which does not allow liquid to flow out."
  components:
  - type: Sprite
    state: condom_teal