  suffix: ERP
  name: red shibari
  components:
  - type: Handcuff
    cuffedRSI: _ERP/Clothing/OuterClothing/Misc/shibari_red.rsi
  - type: Sprite
    sprite: _ERP/Clothing/OuterClothing/Misc/shibari_red.rsi
    state: handcuff
    scale: 0.7,0.7

- type: entity
  parent: BaseItem
  id: ERPHandcuffsERP
  suffix: ERP
  name: toy handcuffs
  description: Soft toy handcuffs. Classic!
  components:
  - type: Item
    size: Small
  - type: Handcuff
    cuffedRSI: _ERP/Objects/Handcuffs/handcuff.rsi
    bodyIconState: body-overlay
    breakoutTime: 3
    cuffTime: 7
    uncuffTime: 3
    stunBonus: 4
